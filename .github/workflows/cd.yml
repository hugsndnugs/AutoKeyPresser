name: CD

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.4.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.4.0)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write  # Required to create releases
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Determine and update version
      id: version
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $VERSION = "${{ github.event.inputs.version }}"
        } else {
          $VERSION = "${{ github.ref_name }}" -replace '^v', ''
        }
        echo "version=$VERSION" >> $env:GITHUB_OUTPUT
        Write-Host "Version: $VERSION"
        
        # Update version in key_clicker.py
        try {
          $content = Get-Content "key_clicker.py" -Raw -ErrorAction Stop
          $newContent = [regex]::Replace($content, '__version__ = "[^"]+"', "__version__ = `"$VERSION`"")
          Set-Content -Path "key_clicker.py" -Value $newContent -Encoding UTF8 -ErrorAction Stop
          Write-Host "Updated key_clicker.py with version $VERSION"
        }
        catch {
          Write-Error "Failed to update version in key_clicker.py: $_"
          exit 1
        }
        
        # Update latest_version.txt
        try {
          Set-Content -Path "latest_version.txt" -Value $VERSION -Encoding UTF8 -ErrorAction Stop
          Write-Host "Updated latest_version.txt with version $VERSION"
        }
        catch {
          Write-Error "Failed to update latest_version.txt: $_"
          exit 1
        }
    
    - name: Verify version update
      shell: pwsh
      run: |
        $content = Get-Content "key_clicker.py" -Raw
        if ($content -match '__version__ = "([^"]+)"') {
          Write-Host "Code version: $($matches[1])"
        } else {
          Write-Error "Could not find version in key_clicker.py"
          exit 1
        }
        $latest = Get-Content latest_version.txt -Raw
        Write-Host "Latest version file: $latest"
    
    - name: Create icon if missing
      shell: pwsh
      run: |
        if (-not (Test-Path "icon.ico")) {
          Write-Host "Creating icon.ico..."
          python -c "from PIL import Image, ImageDraw; img = Image.new('RGB', (256, 256), color='white'); draw = ImageDraw.Draw(img); draw.rectangle([64, 64, 192, 192], fill='black'); img.save('icon.ico'); print('Icon created successfully')"
        } else {
          Write-Host "Icon already exists"
        }
    
    - name: Build executable
      shell: pwsh
      run: |
        python build.py
    
    - name: Verify executable exists
      shell: pwsh
      run: |
        if (Test-Path "dist\AutoKeyClicker.exe") {
          Write-Host "Executable built successfully"
          Get-Item "dist\AutoKeyClicker.exe" | Select-Object Name, Length, LastWriteTime
        } else {
          Write-Error "Executable not found!"
          exit 1
        }
    
    - name: Create release archive
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $archiveName = "AutoKeyClicker-v$version.zip"
        Compress-Archive -Path "dist\AutoKeyClicker.exe", "README.md", "theme.json", "requirements.txt" -DestinationPath $archiveName -Force
        Write-Host "Created archive: $archiveName"
        Get-Item $archiveName | Select-Object Name, Length
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release v${{ steps.version.outputs.version }}
        body: |
          ## Auto Key Clicker v${{ steps.version.outputs.version }}
          
          ### Changes
          - See commit history for details
          
          ### Installation
          1. Download `AutoKeyClicker-v${{ steps.version.outputs.version }}.zip`
          2. Extract the archive
          3. Run `AutoKeyClicker.exe`
          
          ### System Requirements
          - Windows 10/11
          - No additional dependencies required
        draft: false
        prerelease: false
        files: |
          AutoKeyClicker-v${{ steps.version.outputs.version }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Cleanup build artifacts
      if: always()
      shell: pwsh
      run: |
        Write-Host "Build and release complete"
