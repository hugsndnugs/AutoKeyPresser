name: CD

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.4.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.4.0)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Determine version
      id: version
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $VERSION = "${{ github.event.inputs.version }}"
        } else {
          $VERSION = "${{ github.ref_name }}" -replace '^v', ''
        }
        echo "version=$VERSION" >> $env:GITHUB_OUTPUT
        Write-Host "Version: $VERSION"
        # Create Python script to update version
        $script = @"
import re
version = '$VERSION'
content = open('key_clicker.py', 'r', encoding='utf-8').read()
updated = re.sub(r'__version__ = "[^"]+"', f'__version__ = "{version}"', content)
open('key_clicker.py', 'w', encoding='utf-8').write(updated)
open('latest_version.txt', 'w', encoding='utf-8').write(version)
"@
        $script | Out-File -FilePath update_version.py -Encoding utf8
        python update_version.py
      shell: pwsh
    
    - name: Verify version update
      run: |
        python -c "import re; content = open('key_clicker.py', 'r', encoding='utf-8').read(); m = re.search(r'__version__ = \"([^\"]+)\"', content); print(f'Code version: {m.group(1)}')"
        $latest = Get-Content latest_version.txt -Raw
        Write-Host "Version file: $latest"
      shell: pwsh
    
    - name: Create icon if missing
      run: |
        if (-not (Test-Path "icon.ico")) {
          $iconScript = @"
from PIL import Image, ImageDraw
import os
icon_path = 'icon.ico'
img = Image.new('RGB', (256, 256), color='white')
draw = ImageDraw.Draw(img)
draw.rectangle([64, 64, 192, 192], fill='black')
img.save(icon_path)
"@
          $iconScript | Out-File -FilePath create_icon.py -Encoding utf8
          python create_icon.py
          Write-Host "Icon created"
        } else {
          Write-Host "Icon already exists"
        }
      shell: pwsh
    
    - name: Build executable
      run: |
        python build.py
    
    - name: Verify executable exists
      run: |
        if (Test-Path "dist\AutoKeyClicker.exe") {
          Write-Host "Executable built successfully"
          Get-Item "dist\AutoKeyClicker.exe" | Select-Object Name, Length, LastWriteTime
        } else {
          Write-Error "Executable not found!"
          exit 1
        }
      shell: pwsh
    
    - name: Create release archive
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $archiveName = "AutoKeyClicker-v$version.zip"
        Compress-Archive -Path "dist\AutoKeyClicker.exe", "README.md", "theme.json", "requirements.txt" -DestinationPath $archiveName -Force
        Write-Host "Created archive: $archiveName"
        Get-Item $archiveName | Select-Object Name, Length
      shell: pwsh
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release v${{ steps.version.outputs.version }}
        body: |
          ## Auto Key Clicker v${{ steps.version.outputs.version }}
          
          ### Changes
          - See commit history for details
          
          ### Installation
          1. Download `AutoKeyClicker-v${{ steps.version.outputs.version }}.zip`
          2. Extract the archive
          3. Run `AutoKeyClicker.exe`
          
          ### System Requirements
          - Windows 10/11
          - No additional dependencies required
        draft: false
        prerelease: false
        files: |
          AutoKeyClicker-v${{ steps.version.outputs.version }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Cleanup temporary files
      if: always()
      run: |
        Remove-Item -Path "update_version.py", "create_icon.py" -ErrorAction SilentlyContinue
        Write-Host "Cleaned up temporary files"
      shell: pwsh
